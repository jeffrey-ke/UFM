# Light-touch full fine-tune on shelf-optflow (pairs with dataset=optflow_finetune).
# Aug off: symmetrize_inputs=False (no ref↔obs batch doubling).
defaults:
  - default

symmetrize_inputs: False

effective_batch_size: 2
num_epochs: 6                     # ≈ 6 passes ≈ 7470 steps (1245/epoch @ optflow_pairs=2490)
warmup_epochs: 0.6                # 0.6 × 1245 ≈ 747 steps ≈ 10%
learning_rate:
  encoder: 1.0e-6
  info_sharing: 1.0e-5
  output_head: 1.0e-5
  uncertainty_head: 0             # frozen (lr 0 → requires_grad False), per UFM-980
save_ckpt_every_steps: 2000
save_ckpt_every_epochs: 1
keep_n_epoch_ckpts: 3
validate_every_epochs: 1
